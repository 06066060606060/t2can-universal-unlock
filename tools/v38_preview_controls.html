<aside aria-label="Preview controls" id="t2PreviewControls">
  <div class="previewControlsEyebrow">PREVIEW CONTROLS</div>
  <div class="previewControlsTitle">Home simulator</div>
  <div class="previewControlsLabel">AP state</div>
  <div aria-label="AP state" class="previewApChoices" role="group">
    <button data-preview-ap="OFF" type="button">OFF</button>
    <button data-preview-ap="AUTOSTEER" type="button">AUTOSTEER</button>
    <button data-preview-ap="NOA" type="button">NOA</button>
  </div>
  <div class="previewControlsLabel">Vehicle model</div>
  <div aria-label="Vehicle model" class="previewModelChoices" role="group">
    <button data-preview-model="1" type="button">Model Y L</button>
    <button data-preview-model="2" type="button">Y Juniper</button>
    <button data-preview-model="3" type="button">Y Legacy</button>
    <button data-preview-model="4" type="button">3 Highland</button>
    <button data-preview-model="5" type="button">3 Legacy</button>
  </div>
  <div class="previewControlsLabel">CAN topology</div>
  <div aria-label="CAN topology" class="previewTopologyChoices" role="group">
    <button data-preview-topology="1" type="button">Party + VH</button>
    <button data-preview-topology="2" type="button">Body + Chassis</button>
    <button data-preview-topology="3" type="button">Party + Chassis</button>
  </div>
  <div id="previewTurnWrap">
    <div class="previewControlsLabel">Turn controls</div>
    <div aria-label="Turn controls" class="previewTurnChoices" role="group">
      <button data-preview-turn="1" type="button">Stalk</button>
      <button data-preview-turn="2" type="button">Stalkless</button>
    </div>
  </div>
  <p class="previewControlsNote">Preview data only. Selection does not change firmware settings or send CAN.</p>
</aside>
