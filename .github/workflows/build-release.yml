name: Build and release Chinese Dashboard firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: '1.6.0'

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install MCP2515 library
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/autowp/arduino-mcp2515 \
            "$HOME/Arduino/libraries/autowp-mcp2515"

      - name: Regenerate embedded dashboard header
        run: |
          python3 -m pip install --quiet zopfli
          python3 tools/build_dashboard.py

      - name: Stage Arduino sketch
        run: |
          mkdir -p "$RUNNER_TEMP/sketch/T2CAN-Universal-v3.29.1-LP_YL"
          cp *.h *.ino "$RUNNER_TEMP/sketch/T2CAN-Universal-v3.29.1-LP_YL/"
          ls -l "$RUNNER_TEMP/sketch/T2CAN-Universal-v3.29.1-LP_YL" | head

      - name: Compile
        run: |
          mkdir -p dist
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=cdc,USBMode=hwcdc,FlashMode=qio,CPUFreq=240,DebugLevel=none" \
            --output-dir dist "$RUNNER_TEMP/sketch/T2CAN-Universal-v3.29.1-LP_YL"
          ls -l dist

      - name: Rename release assets and checksums
        run: |
          cd dist
          mv "T2CAN-Universal-v3.29.1-LP_YL.ino.bin" \
             "T2CAN-Universal-v3.29.1-LP_YL-zh.OTA.bin"
          mv "T2CAN-Universal-v3.29.1-LP_YL.ino.merged.bin" \
             "T2CAN-Universal-v3.29.1-LP_YL-zh.fullflash.bin"
          sha256sum T2CAN-Universal-v3.29.1-LP_YL-zh.OTA.bin \
                    T2CAN-Universal-v3.29.1-LP_YL-zh.fullflash.bin \
                    > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: T2CAN-Universal-v3.29.1-zh
          path: |
            dist/T2CAN-Universal-v3.29.1-LP_YL-zh.OTA.bin
            dist/T2CAN-Universal-v3.29.1-LP_YL-zh.fullflash.bin
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: T2CAN Universal v3.29.1 中文 Dashboard (${{ github.ref_name }})
          body_path: .github/release-notes.md
          files: |
            dist/T2CAN-Universal-v3.29.1-LP_YL-zh.OTA.bin
            dist/T2CAN-Universal-v3.29.1-LP_YL-zh.fullflash.bin
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
